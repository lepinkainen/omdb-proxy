# Runs the published image. See ai-docs/deployment.md for the reasoning.
# `mkdir -p data` before the first `up` — Docker would create it as root.
services:
  omdb-proxy:
    image: ghcr.io/lepinkainen/omdb-proxy:latest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8090:8090"
    env_file:
      - .env
    volumes:
      - ./data:/data

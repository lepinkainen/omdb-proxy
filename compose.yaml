services:
  omdb-proxy:
    # Builds from this checkout. To run the published image instead, use
    # compose.prod.yaml, which needs no source tree.
    build: .
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    volumes:
      - omdb-proxy-data:/data

volumes:
  omdb-proxy-data:
